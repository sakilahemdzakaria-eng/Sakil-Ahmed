<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakil Ahmed Zakaria - Portfolio</title>
    <meta name="description" content="Portfolio of Sakil Ahmed Zakaria, Marketer & Campaign Manager managing social media and digital growth campaigns for 21+ UK restaurants from Sylhet, Bangladesh." />
    <meta property="og:title" content="Sakil Ahmed Zakaria - Portfolio" />
    <meta property="og:description" content="Portfolio of Sakil Ahmed Zakaria, Marketer & Campaign Manager managing social media and digital growth campaigns for 21+ UK restaurants from Sylhet, Bangladesh." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  </head>
  <body class="bg-[#0a0720] text-[#eeeeff] selection:bg-[#8b5cf6]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback loader if deployed directly to static root without Vite dev server
      window.addEventListener('error', function(e) {
        if (e.target && e.target.src && e.target.src.includes('main.tsx')) {
          console.warn('Static deployment detected. Loading bundle from dist...');
          if (!document.getElementById('static-css-bundle')) {
            var link = document.createElement('link');
            link.id = 'static-css-bundle';
            link.rel = 'stylesheet';
            link.href = './dist/assets/index.css';
            document.head.appendChild(link);
          }
          if (!document.getElementById('static-js-bundle')) {
            var script = document.createElement('script');
            script.id = 'static-js-bundle';
            script.type = 'module';
            script.src = './dist/assets/index.js';
            document.body.appendChild(script);
          }
        }
      }, true);
    </script>
  </body>
</html>
